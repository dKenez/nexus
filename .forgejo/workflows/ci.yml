name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: docker
    timeout-minutes: 20
    # The runner puts job and services on the host network: Postgres is on localhost.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
    env:
      # Run the suite against real Postgres as well as the SQLite default.
      NEXUS_TEST_DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/mise
      - run: uv sync --frozen
      - run: prek run --all-files --show-diff-on-failure
      - name: Wait for Postgres
        run: timeout 60 bash -c 'until (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null; do sleep 1; done'
      - run: mise run check

  image:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/docker-cli
      - run: docker buildx build --tag nexus:ci .
