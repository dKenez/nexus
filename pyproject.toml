[project]
name = "nexus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1.0",
    "fastapi[standard]>=0.128.8",
    "python-dotenv>=1.2.1",
    "typer>=0.23.0",
]

[project.scripts]
nexus = "nexus:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.9.1",
    "ty>=0.0.16",
]
