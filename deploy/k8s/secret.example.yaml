---
# TEMPLATE ONLY. In edda this becomes k8s/apps/nexus/config.sops.yaml, encrypted with
#   sops k8s/apps/nexus/config.sops.yaml
# Every key is an environment variable name (the Deployment uses envFrom).
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secret
  namespace: apps
type: Opaque
stringData:
  NEXUS_API_TOKEN: "<openssl rand -hex 32>"
  # apps-pg role + database from edda's sgscript-nexus.yaml
  DATABASE_URL: "postgresql+asyncpg://nexus:<password>@apps-pg.data.svc.cluster.local:5432/nexus"

  # Token of the PRODUCTION Hetzner project (the one that owns the static Primary IP).
  HCLOUD_TOKEN: "<hetzner api token, read+write>"

  # ed25519, OpenSSH format (ssh-keygen -t ed25519 -N ''). The client key logs in to the VM;
  # the host key is installed on every VM so nexus can verify it without trust-on-first-use.
  SSH_CLIENT_KEY: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...
    -----END OPENSSH PRIVATE KEY-----
  SSH_HOST_KEY: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...
    -----END OPENSSH PRIVATE KEY-----

  DISCORD_TOKEN: "<bot token>"
  DISCORD_GUILD_ID: "1317626947916009482"
  DISCORD_NOTIFY_CHANNEL_ID: "<channel id>"
  DISCORD_ROLES_VIEWER: "<role id>,<role id>"
  DISCORD_ROLES_OPERATOR: "<role id>"
  DISCORD_ROLES_ADMIN: "<role id>"

  NEXUS_GAME_VALHEIM_SERVER_PASSWORD: "<at least 5 characters>"
