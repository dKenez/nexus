name = "valheim"
display_name = "Valheim"
# The same image the current prod server runs: https://github.com/lloesche/valheim-server-docker
# It downloads and updates the game itself at container start (from steamcmd).
image = "docker.io/lloesche/valheim-server"
version = "latest"
enabled = true

# World, admin/ban/permit lists and settings. Everything here is backed up to ymir on stop
# and restored on start. (/opt/valheim only holds the downloaded server; not backed up.)
data_path = "/config"
memory_mb = 4096

ports = [
    { port = 2456, protocol = "udp" },
    { port = 2457, protocol = "udp" },
]
# Valheim answers Steam A2S queries on game port + 1.
query = { type = "a2s", port = 2457 }

idle_minutes = 10
# First boot downloads the server (~1 GB) before it answers queries.
startup_grace_minutes = 15
startup_timeout = 900
# The image docs recommend --stop-timeout 120 so the world is saved on shutdown.
stop_grace_seconds = 120

# Read from NEXUS_GAME_VALHEIM_<KEY> in nexus's environment.
secret_env = ["SERVER_PASS"]

# Any [env] value can also be overridden per deployment with NEXUS_GAME_VALHEIM_<KEY>.
[env]
SERVER_NAME = "Vastness of Eternity"
# The world's folder in worlds_local/. Must match the imported world, or Valheim creates a
# new empty one.
WORLD_NAME = "VoE"
SERVER_PUBLIC = "false"
TZ = "Europe/Copenhagen"
# In-game snapshots: the image zips worlds_local/ hourly while players are on, and is
# save-aware (retries if a save overlapped). nexus copies each new zip to ymir (see the
# snapshots table below), so a lost VM costs at most about an hour of play. The count cap
# keeps the copies inside /config, and so every full backup, small.
BACKUPS = "true"
BACKUPS_MAX_COUNT = "6"
BACKUPS_IF_IDLE = "false"
# nexus owns the lifecycle: every start is a fresh VM with a fresh server download.
UPDATE_CRON = ""
RESTART_CRON = ""

# `nexus games import valheim <archive>` checks and cleans an imported /config:
[import]
# it must contain the world named above...
required = ["worlds_local/{WORLD_NAME}*"]
# ...and the image's own snapshot zips are left out (they can be large and aren't needed).
exclude = ["backups"]

[snapshots]
dir = "backups"
check_minutes = 10
# About two days of play at one snapshot per hour.
keep = 48
