# Used by `mise run db:migrate` / `db:revision`. The app itself migrates on startup
# (nexus.db.session.upgrade) and does not read this file. The URL comes from DATABASE_URL.
[alembic]
script_location = src/nexus/db/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
